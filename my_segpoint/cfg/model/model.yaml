GEM:
  num_layers: 3
  deform_radius: 5.0
  num_samples: 16
  KPConv:
    in_channels: [3, 64, 128]
    out_channels: [64, 128, 256]
    other:
      radius: 0.03
      sigma: 1.2
      num_kernel_points: 15
      in_points_dim: 3
      fixed_kernel_points: center
      KP_influence: linear
      aggregation_mode: sum
      use_batchnorm: True
      bn_momentum: 0.02


Point_encoder:
  Uni3D:
    load_pretrained_uni3d: True
    freeze: True
    pc_model: eva02_base_patch14_448
    pretrained_pc: ""
    ckpt_path: model/modules/Uni3D/path/to/checkpoints/model.pt
    drop_path_rate: 0.0

    PointcloudEncoder:
      token_unit: region
      pc_feat_dim: 768
      embed_dim: 1024
      group_size: 64
      num_group: 16          # Too many..?? MODIFICATION needed
      pc_encoder_dim: 512
      patch_dropout: 0.0
  
  CA_Uni3D:
    num_groups: 32
    group_size: 1024
    flash_attention: True
    num_heads: 8
    dropout_rate: 0.20
    gem_dim: 256
    align_clip_dim: True
    num_CA_layers: 4


GFP:
  flash_attention: True
  selected_intermed_idx: [-2, -1]
  num_intermed_feats: [2048, 4096]
  gem_dim: 256
  pc_feat_dim: 768
  num_neighbors: 5
  num_heads: 8
  dropout_rate: 0.2
  LLM_hidden_dim: 4096


LLM:
  model_name: meta-llama/Llama-2-7b-chat-hf
  new_model_name: SegPoint_Llama2-7b-chat
  truncation_side: right
  padding_side: right

  seg_token: "[SEG]"
  point_token: "[POINT]"
  pc_start_token: "[PC_START]"
  pc_end_token: "[PC_END]"

  LoRA:
    train_with: True
    new_model_name: SegPoint_Llama2-7b-chat
    rank: 16
    alpha: 16
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    dropout: 0.0

SEG_projector:
  sizes: [4096, 4096, 256]

loss_weights: [1.0, 2.0, 2.0]

distributed: False