system_prompts:
  text: You are an AI visual assistant that can analyze 3D scenes, receiving point clouds of the scene. When the user asks for segmentation, you must output the category name followed by the token [SEG]. The conversation centers around an indoor scene.
  add_sys_delimiters: True
  category_list_prompt: "You can only select category names from the following list: {category_list}"

SemanticSegmentation:
  specific:
    few_shot: True
    # <POINT> token will go infront of USER prompts
    USER:  
      - Can you segment the {category} category in this point cloud?
      - Segment the {category} in this point cloud.
      - Provide the segmentation token for {category}.
      - Highlight the region containing {category}.
      - Output the segmentation for {category} in this point cloud.
      - Please produce a mask for the {category}.
      - Can you show me the {category} segmentation in this scene?
      - Generate the mask that covers the {category} in this scene.
      - Assign a segmentation token to {category}.
    ASSISTANT: 
      - "{category} [SEG]."
      - "{category} [SEG]."
      - "[SEG] {category}."
      - "The mask is [SEG] for {category}."
      - "Segmentation: [SEG] for {category}."
      - "Mask: {category} [SEG]."
      - "[SEG] indicates the {category}."
      - "{category}: [SEG]."
      - "Assigned token : [SEG] for {category}."
  all_categories:
  ### ADD prompts -> all categories in scannet should be given
    few_shot: True
    USER:  
      - Can you segment all the semantic masks in this point cloud and output separate masks for each category in the alphabetical order of the categories?
      - Provide segmentation masks for all categories in this scene. You should output all categories in alphabetical order with separate masks for each category.
      - Output segmentation tokens for every category in this point cloud. You must output all categories in alphabetical order.
      - Can you give [SEG] token for each detected categories in this point cloud? Each [SEG] token should be placed in alphabetical order according to its category.
      - Segment all categories in this scene alphabetically.
      - Please output separate segmentation masks for each category in the scene. [SEG] tokens should be arranged in alphabetical order based on their corresponding categories.
      - Can you generate tokens for category masks in this point cloud? List each [SEG] token in alphabetical order by category.
      - Show all the segmentation masks per category. All masks should be placed in alphabetical order of each category name.
      - Produce semantic masks for all the categories in the point cloud scene. All masks should be followed by its category name and listed in alphabetical order by category.
    # Should output all the categories in the scene. Therefore, in the output {category} [SEG] should appear as much as the number of categories in the scene
    ASSISTANT: 
      - ["", " {category} [SEG],"]
      - ["", " {category} [SEG],"]
      - ["Masks:", " {category} [SEG],"]
      - ["", " [SEG] {category},"]
      - ["", " [SEG] {category},"]
      - ["", " {category}: [SEG],"]
      - ["", " {category} [SEG],"]
      - ["", " [SEG] {category},"]
      - ["", " [SEG] {category},"]

ReferringSegmentation:
  specific:
    USER:  Can you segment the object {description} in this point cloud?
    ASSISTANT: "{category} [SEG]."

